[project]
name = "sigrh-api"
version = "0.1.0"
description = "API SIGRH — Ministère du Portefeuille de l'État"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "channels>=4.2",
    "daphne>=4.1",
    "reportlab>=4.2",
    "celery>=5.4",
    "redis>=5.2,<6",
    "channels-redis>=4.2",
    "uvicorn>=0.30",
    "websockets>=13",
    "whitenoise>=6.7",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["personnel"]

[tool.uv]
package = false
